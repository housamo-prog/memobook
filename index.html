<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>أثر الحي - ذاكرة حية للأحياء</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #FAF6EE;
      color: #2C2416;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .font-amiri {
      font-family: 'Amiri', serif;
    }
    header {
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .bottom-bar {
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    #map-container {
      flex: 1;
      width: 100%;
      position: relative;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }
    .leaflet-popup-content-wrapper {
      background-color: #FFFDF9;
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .leaflet-popup-tip {
      background-color: #FFFDF9;
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header class="bg-[#3D2B1F] text-[#F3E9D2] px-4 pb-3 shadow-xl z-20 flex justify-between items-center border-b border-[#D4A373]/30">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-full bg-[#D4A373] text-[#3D2B1F] flex items-center justify-center font-bold font-amiri text-xl shadow-inner">
        أ
      </div>
      <div>
        <h1 class="text-sm font-bold font-amiri leading-tight">أثر الحي</h1>
        <p class="text-[10px] text-[#CCD5AE]" id="user-rank">مستكشف مبتدئ</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="text-center bg-[#4A3525] px-3 py-1 rounded-xl border border-[#D4A373]/20">
        <span class="text-[10px] text-[#CCD5AE] block leading-none mb-0.5">النقاط</span>
        <span class="text-xs font-bold text-[#E9EDC9]" id="user-points">0</span>
      </div>
    </div>
  </header>

  <!-- Map Container -->
  <div id="map-container">
    <div id="map"></div>

    <!-- Floating Location Button -->
    <div class="absolute bottom-4 right-4 z-10">
      <button id="locate-me" class="w-12 h-12 bg-white hover:bg-gray-50 text-gray-800 rounded-full shadow-xl border border-gray-200 flex items-center justify-center text-xl transition active:scale-95">
        📍
      </button>
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <div class="bottom-bar bg-[#3D2B1F] px-4 pt-3 z-25 shadow-2xl border-t border-[#D4A373]/30">
    <button id="open-modal" class="w-full bg-[#D4A373] hover:bg-[#BC8A5F] text-[#3D2B1F] font-bold text-sm py-3.5 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
      <span class="text-lg">✨</span> أضف كبسولة زمنيّة هنا
    </button>
  </div>

  <!-- Add Capsule Modal -->
  <div id="capsule-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-[#FFFDF9] w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-[#E6DCC8] max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-3">
        <h2 class="font-amiri text-xl font-bold text-[#3D2B1F]">غرس كبسولة ذاكرة جديدة</h2>
        <button id="close-modal" class="text-gray-400 hover:text-gray-700 text-xl font-bold p-1">✕</button>
      </div>

      <form id="capsule-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">عنوان القصة أو المعلم</label>
          <input type="text" id="title" required placeholder="مثال: دكان العطار القديم - زقاق الميدان" class="w-full text-xs p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D4A373] bg-[#FAF6EE]/50">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">تفاصيل القصة أو الذكرى التاريخية</label>
          <textarea id="story" rows="3" required placeholder="اكتب هنا التفاصيل والحكاية المنسية..." class="w-full text-xs p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D4A373] bg-[#FAF6EE]/50"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">تسجيل صوتي (اختياري - حكاية صوتية)</label>
          <div class="flex items-center gap-2">
            <button type="button" id="record-btn" class="flex-1 py-2.5 px-3 text-xs bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-xl border border-gray-300 flex items-center justify-center gap-2 transition">
              <span>🎤</span> <span id="record-text">اضغط لبدء التسجيل الصوتيّ</span>
            </button>
          </div>
          <audio id="audio-preview" controls class="hidden w-full mt-2 h-9"></audio>
        </div>

        <button type="submit" class="w-full py-3.5 bg-[#D4A373] hover:bg-[#BC8A5F] text-white font-bold text-xs rounded-xl transition shadow-md">
          تثبيت الكبسولة على الخريطة (+20 نقطة)
        </button>
      </form>

    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let userPoints = parseInt(localStorage.getItem('user_points')) || 0;
    let userLocation = [36.1993, 37.1592];
    let mediaRecorder, audioChunks = [], audioBase64 = null;
    let selectedCoords = [...userLocation];

    let capsules = JSON.parse(localStorage.getItem('capsules_data')) || [
      {
        id: 1,
        title: "حكايات خان الشونة",
        story: "تأسس الخان في القرن السادس عشر وكان ملتقى للتجار والرحالة. هنا كانت تُعقد صفقات التوابل والحرير.",
        lat: 36.1978,
        lng: 37.1580,
        unlocked: true,
        points: 15,
        audio: null
      },
      {
        id: 2,
        title: "سرّ زقاق الياسمين",
        story: "هذا الزقاق شهد أول ورشة لصناعة صابون الغار على الطريقة التقليدية منذ أربعة عقود.",
        lat: 36.2010,
        lng: 37.1610,
        unlocked: false,
        points: 25,
        audio: null
      }
    ];

    updateUserStats();

    const map = L.map('map', { zoomControl: false }).setView(userLocation, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = [];

    function renderCapsules() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      capsules.forEach(capsule => {
        const markerColor = capsule.unlocked ? '#D4A373' : '#6C584C';
        
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${markerColor}; width: 32px; height: 32px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;">
                  ${capsule.unlocked ? '📖' : '🔒'}
                 </div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const marker = L.marker([capsule.lat, capsule.lng], { icon: customIcon }).addTo(map);

        let audioHtml = '';
        if (capsule.unlocked && capsule.audio) {
          audioHtml = `
            <div class="mt-2 pt-2 border-t border-gray-200">
              <span class="text-[10px] text-gray-500 block mb-1">🎧 التسجيل الصوتي للقصة:</span>
              <audio controls src="${capsule.audio}" class="w-full h-8"></audio>
            </div>
          `;
        }

        const popupContent = `
          <div class="p-2 text-right" dir="rtl" style="min-width: 210px;">
            <h4 class="font-amiri font-bold text-base text-[#3D2B1F] mb-1">${capsule.title}</h4>
            ${capsule.unlocked 
              ? `<p class="text-xs text-gray-700 leading-relaxed mb-2">${capsule.story}</p>${audioHtml}`
              : `<p class="text-xs text-amber-800 bg-amber-50 p-2 rounded-lg border border-amber-200 mb-2">🔒 مغلقة! افتحها الآن لكسب +${capsule.points} نقطة والاستماع لحكايتها.</p>
                 <button onclick="unlockCapsule(${capsule.id})" class="w-full text-xs bg-[#D4A373] text-white py-2 rounded-xl font-bold hover:bg-[#BC8A5F] shadow">فتح الكبسولة</button>`
            }
          </div>
        `;

        marker.bindPopup(popupContent);
        markers.push(marker);
      });

      localStorage.setItem('capsules_data', JSON.stringify(capsules));
    }

    window.unlockCapsule = function(id) {
      const capsule = capsules.find(c => c.id === id);
      if (capsule && !capsule.unlocked) {
        capsule.unlocked = true;
        userPoints += capsule.points;
        updateUserStats();
        renderCapsules();
        alert(`🎉 مبارك! فتحت كبسولة "${capsule.title}" وحصلت على ${capsule.points} نقطة!`);
      }
    };

    function updateUserStats() {
      document.getElementById('user-points').innerText = userPoints;
      localStorage.setItem('user_points', userPoints);
      const rankEl = document.getElementById('user-rank');
      if (userPoints >= 50) rankEl.innerText = "حارس الذاكرة 🏆";
      else if (userPoints >= 20) rankEl.innerText = "مستكشف متقدم 🌟";
      else rankEl.innerText = "مستكشف مبتدئ";
    }

    const modal = document.getElementById('capsule-modal');
    document.getElementById('open-modal').addEventListener('click', () => {
      const center = map.getCenter();
      selectedCoords = [center.lat, center.lng];
      modal.classList.remove('hidden');
    });
    document.getElementById('close-modal').addEventListener('click', () => modal.classList.add('hidden'));

    const recordBtn = document.getElementById('record-btn');
    const recordText = document.getElementById('record-text');
    const audioPreview = document.getElementById('audio-preview');

    recordBtn.addEventListener('click', async () => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              audioBase64 = reader.result;
              audioPreview.src = audioBase64;
              audioPreview.classList.remove('hidden');
            };
          };

          mediaRecorder.start();
          recordText.innerText = "جاري التسجيل... (اضغط للإيقاف)";
          recordBtn.classList.add('bg-red-100', 'text-red-700', 'border-red-300');
        } catch (err) {
          alert("تعذر الوصول إلى الميكروفون.");
        }
      } else {
        mediaRecorder.stop();
        recordText.innerText = "إعادة التسجيل الصوتي";
        recordBtn.classList.remove('bg-red-100', 'text-red-700', 'border-red-300');
      }
    });

    document.getElementById('capsule-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const story = document.getElementById('story').value;

      const newCapsule = {
        id: Date.now(),
        title,
        story,
        lat: selectedCoords[0],
        lng: selectedCoords[1],
        unlocked: true,
        points: 20,
        audio: audioBase64
      };

      capsules.push(newCapsule);
      userPoints += 20;
      updateUserStats();
      renderCapsules();

      e.target.reset();
      audioBase64 = null;
      audioPreview.classList.add('hidden');
      modal.classList.add('hidden');
      alert("✨ تم غرس الكبسولة مع التسجيل الصوتي بنجاح!");
    });

    let userMarker = null;
    document.getElementById('locate-me').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLocation = [pos.coords.latitude, pos.coords.longitude];
          map.setView(userLocation, 17);
          
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker(userLocation, {
            icon: L.divIcon({
              className: 'user-pin',
              html: `<div style="background-color: #3b82f6; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(59,130,246,0.8);"></div>`,
              iconSize: [16, 16],
              iconAnchor: [8, 8]
            })
          }).addTo(map).bindPopup("أنت هنا 📍").openPopup();
        }, () => {
          alert("تعذر تحديد موقعك الحالي. تأكد من تفعيل الخدمة.");
        }, { enableHighAccuracy: true });
      }
    });

    renderCapsules();
  </script>
</body>
</html>
